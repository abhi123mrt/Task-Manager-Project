<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f9;
    }

    /* Top bar */
    .navbar {
        background: #667eea;
        padding: 15px 25px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .navbar h2 {
        margin: 0;
    }

    .logout a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        background: #ff4d4d;
        padding: 8px 12px;
        border-radius: 5px;
    }

    .logout a:hover {
        background: #e60000;
    }

    /* Center content */
    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh;
        gap: 30px;
    }

    .card {
        background: white;
        padding: 30px;
        width: 200px;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    .card a {
        text-decoration: none;
        color: white;
        background: #667eea;
        padding: 10px 15px;
        border-radius: 5px;
        display: inline-block;
        margin-top: 10px;
    }

    .card a:hover {
        background: #5a67d8;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
  <h2>Dashboard</h2>
  <div class="logout">
    <a href="/logout">Logout</a>
  </div>
</div>

<!-- Cards -->
<div class="container">

  <div class="card">
    <h3>Projects</h3>
    <a href="/projects">Open</a>
  </div>

  <div class="card">
    <h3>Tasks</h3>
    <a href="/tasks">Open</a>
  </div>

</div>

</body>
</html>
