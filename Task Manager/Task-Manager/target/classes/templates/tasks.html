<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Tasks</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    /* Header */
    .header {
      background: #667eea;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      background: #ff4d4d;
      padding: 8px 12px;
      border-radius: 5px;
    }

    .header a:hover {
      background: #e60000;
    }

    .container {
      padding: 20px;
    }

    /* Form */
    .form-box {
      margin-bottom: 20px;
    }

    input, select {
      padding: 10px;
      margin-right: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 15px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #5a67d8;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #667eea;
      color: white;
    }

    tr:hover {
      background: #f1f1f1;
    }

    .completed {
      color: green;
      font-weight: bold;
    }

    .pending {
      color: red;
      font-weight: bold;
    }
  </style>

</head>

<body>

<!-- Header -->
<div class="header">
  <h2>Tasks</h2>
  <a href="/dashboard">Back</a>
</div>

<div class="container">

  <!-- Create Task -->
  <div class="form-box">
    <form action="/tasks/create" method="post">
      <input type="text" name="title" placeholder="Task Title" required/>
      <input type="text" name="status" placeholder="Status (Pending/In Progress/Completed)" required/>
      <button type="submit">Add Task</button>
    </form>
  </div>

  <!-- Table -->
  <table>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Status</th>
      <th>Update</th>
    </tr>

    <tr th:each="t : ${tasks}">
      <td th:text="${t.id}"></td>
      <td th:text="${t.title}"></td>

      <!-- Status -->
      <td>
        <span th:classappend="${t.status == 'Completed'} ? 'completed' : 'pending'"
              th:text="${t.status}">
        </span>
      </td>

      <!-- Update -->
      <td>
        <form action="/tasks/update" method="post">
          <input type="hidden" name="id" th:value="${t.id}">

          <select name="status">
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>

          <button>Update</button>
        </form>
      </td>

    </tr>
  </table>

</div>

</body>
</html>
