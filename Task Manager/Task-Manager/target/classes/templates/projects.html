<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Projects</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    /* Header */
    .header {
      background: #667eea;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      background: #ff4d4d;
      padding: 8px 12px;
      border-radius: 5px;
    }

    .header a:hover {
      background: #e60000;
    }

    /* Container */
    .container {
      padding: 20px;
    }

    /* Form */
    .form-box {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 15px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #5a67d8;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #667eea;
      color: white;
    }

    tr:hover {
      background: #f1f1f1;
    }

    .completed {
      color: green;
      font-weight: bold;
    }

    .pending {
      color: red;
      font-weight: bold;
    }
  </style>

</head>

<body>

<!-- Header -->
<div class="header">
  <h2>Projects</h2>
  <a href="/dashboard">Back</a>
</div>

<div class="container">

  <!-- Create Form -->
  <div class="form-box">
    <form action="/projects/create" method="post">
      <input type="text" name="name" placeholder="Project Name" required/>
      <button type="submit">Create</button>
    </form>
  </div>

  <!-- Table -->
  <table>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Status</th>
      <th>Action</th>
    </tr>

    <tr th:each="p : ${projects}">
      <td th:text="${p.id}"></td>
      <td th:text="${p.name}"></td>

      <!-- Status -->
      <td>
        <span th:classappend="${p.completed} ? 'completed' : 'pending'"
              th:text="${p.completed} ? '✔ Completed' : '❌ Pending'">
        </span>
      </td>

      <!-- Action -->
      <td>
        <form action="/projects/complete" method="post">
          <input type="hidden" name="id" th:value="${p.id}">
          <button th:if="!${p.completed}">Mark Complete</button>
        </form>
      </td>

    </tr>
  </table>

</div>

</body>
</html>
